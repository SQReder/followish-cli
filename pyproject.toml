[project]
name = "followish-cli"
version = "0.1.0"
description = "Command-line client for followish.io wishlists, designed for AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
followish = "followish:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["followish"]
